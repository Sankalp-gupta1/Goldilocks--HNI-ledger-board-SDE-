name: Verify ledger workspace
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python and OCR dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr fonts-dejavu-core
          pip install -r requirements-dev.txt
      - name: Build the React workspace
        run: npm ci --prefix frontend && npm test --prefix frontend && npm run build --prefix frontend
      - name: Check accounting, imports, authentication and isolation
        run: python -m pytest tests -q
      - name: Browser dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Exercise the browser with the real API
        working-directory: frontend
        env:
          PYTHON_BIN: python
        run: npx playwright test
      - name: Retain failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-evidence
          path: frontend/test-results
          retention-days: 7
